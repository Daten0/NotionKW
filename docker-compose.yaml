# ===================Updated====================== #
services:
  # 🗄️ DATABASE
  db:
    image: mysql:8.0.1     # ✅ Gunakan server resmi, bukan client alpine
    container_name: notion_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"           # ✅ Standar Host:Container
    volumes:
      - db_data:/var/lib/mysql:Z
    networks:
      - notion_net

  # ⚙️ BACKEND
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: notion_backend
    restart: unless-stopped
    env_file:
      - .env                  # Load default dari .env
    environment:
      # ⚠️ PENTING: Override khusus Docker Network
      DB_HOST: db             # ✅ "db" adalah nama service container database
      APP_PORT: ${APP_PORT}              # ✅ Backend jalan di port 3000 (bukan 3306)
      DB_PORT: ${DB_PORT}          # ✅ Port internal MySQL di container db
    ports:
      - "${APP_PORT}:3000"           # ✅ Sesuaikan dengan PORT aplikasi
    depends_on:
      - db
    networks:
      - notion_net

  # 🌐 FRONTEND
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: notion_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - notion_net
  
  # 📊 PROMETHEUS (Metrics Storage)
  prometheus:
    image: prom/prometheus:latest  # Already Alpine-based
    container_name: notion_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=12h'
      - '--storage.tsdb.max-block-duration=2h'
      - '--storage.tsdb.min-block-duration=2h'
      - '--web.enable-lifecycle'
    networks:
      - notion_net
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.4'

  # 📈 GRAFANA (Visualization)
  grafana:
    image: grafana/grafana:10.4.0 # Alpine version!
    container_name: notion_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"  # Port 3001 to avoid conflict
    volumes:
      - grafana_:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=${GF_USERS_ALLOW_SIGN_UP}
      # - GF_RENDERING_SERVER_URL=  # Disable rendering (saves RAM)
    networks:
      - notion_net
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: '0.2'

  # 🐳 CADVISOR (Docker Container Metrics)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: notion_cadvisor
    restart: unless-stopped
    privileged: true # Untuk sementara waktu diberikan akses root
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro,Z                    # ← Tambah :Z
      - /var/run:/var/run:ro,Z            # ← Tambah :Z
      - /sys:/sys:ro,Z                    # ← Tambah :Z
      # - /var/lib/containers/storage:/var/lib/docker:ro,Z  # ← Tambah :Z (PENTING)
      - /dev/disk/:/dev/disk:ro,Z         # ← Tambah :Z
    command:
      - '--housekeeping_interval=10s'
      - '--docker=false'
      - '--containerd=false'
      - '--podman=true'
      - '--store_container_labels=false'
    networks:
      - notion_net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'

volumes:
  db_data:
  prometheus_:
  grafana_:

networks:
  notion_net:
    driver: bridge