# ===================Updated====================== #
services:
  # 🗄️ DATABASE
  db:
    image: mysql:8.4   # ✅ Gunakan server resmi, bukan client alpine
    container_name: notion_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "${DB_PORT}:3306"           # ✅ Standar Host:Container
    volumes:
      - db_data:/var/lib/mysql:Z
    networks:
      - notion_net

  # ⚙️ BACKEND
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: notion_backend
    restart: unless-stopped
    env_file:
      - .env                  # Load default dari .env
    environment:
      # ⚠️ PENTING: Override khusus Docker Network
      DB_HOST: db             # ✅ "db" adalah nama service container database
      DB_USER: ${DB_USER}     # ✅ Explicit from .env
      DB_PASSWORD: ${DB_PASSWORD}  # ✅ Explicit from .env
      DB_NAME: ${DB_NAME}     # ✅ Explicit from .env
      APP_PORT: ${APP_PORT}   # ✅ Backend jalan di port 3000
      DB_PORT: ${DB_PORT}     # ✅ Port internal MySQL di container db
    ports:
      - "${APP_PORT}:3000"    # ✅ Sesuaikan dengan PORT aplikasi
    depends_on:
      - db
    networks:
      - notion_net

  # 🌐 FRONTEND
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: notion_frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - notion_net
  
  # 📊 PROMETHEUS (Metrics Storage)
  prometheus:
    image: prom/prometheus:latest  # Already Alpine-based
    container_name: notion_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=12h'
      - '--storage.tsdb.max-block-duration=2h'
      - '--storage.tsdb.min-block-duration=2h'
      - '--web.enable-lifecycle'
    networks:
      - notion_net
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.4'

  # 📈 GRAFANA (Visualization)
  grafana:
    image: grafana/grafana:10.4.0 # Alpine version!
    container_name: notion_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"  # Port 3001 to avoid conflict
    volumes:
      - grafana_:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=${GF_USERS_ALLOW_SIGN_UP}
      # - GF_RENDERING_SERVER_URL=  # Disable rendering (saves RAM)
    networks:
      - notion_net
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: '0.2'

volumes:
  db_data:
  prometheus_:
  grafana_:

networks:
  notion_net:
    driver: bridge